# osdk uses the rsproxy.cn mirror for the crates.io registry so contributors in
# China (and this environment) get fast builds. Override by editing or removing.
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true
