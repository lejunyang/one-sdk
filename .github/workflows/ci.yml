name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so clippy/rustc lints stay clean.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is OS-independent; run it once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: live smoke harness
        run: ./scripts/test-live-smoke.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: check minimum supported Rust version
        run: cargo check --locked --workspace

  installers:
    name: installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.x"
      # `./scripts/test-installers.sh` once exited 2 in 0.17s with no output on
      # ubuntu while the same commit passed on macOS. A script that echoes from
      # its first steps, and contains no `exit 2`, producing nothing at all means
      # it never started -- so record the things that stop a script before line
      # one. Never fails the job by itself.
      - name: Installer preflight
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          echo "bash: $(bash --version | head -1)"
          echo "shell: $SHELL   uid: $(id -u)   pwd: $(pwd)"
          echo "mktemp -d: $(mktemp -d 2>&1)"
          echo "--- scripts/ ---"
          ls -l scripts/ || echo "scripts/ is missing"
          echo "--- the script itself ---"
          ls -l scripts/test-installers.sh || echo "test-installers.sh is missing"
          echo "executable: $([ -x scripts/test-installers.sh ] && echo yes || echo NO)"
          echo "first line: $(head -1 scripts/test-installers.sh | cat -A)"
          echo "interpreter: $(head -1 scripts/test-installers.sh | sed 's|^#!||' | awk '{print $1}')"
          echo "syntax check: $(bash -n scripts/test-installers.sh 2>&1 && echo ok)"
          echo "df -h /tmp:"; df -h /tmp
          exit 0
      - name: Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/run-unix-installer-smoke.sh
      - name: PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1

  # Keep the interactive terminal contract visible on both macOS architectures.
  # This uses native GitHub-hosted macOS machines rather than emulation.
  macos-terminal:
    name: macOS terminal (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: interactive prompt through native PTY
        run: >-
          cargo test --locked -p osdk-cli --test isolated_cli
          terminal_prompt_accepts_interactive_confirmation -- --exact

  # Lint + unit tests across the three supported platforms.
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
        env:
          # Only the generic github: backend needs this. Current tests use local
          # fixture servers and do not require network access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build windows runtime binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: cargo build --locked --workspace --bins
      - name: windows runtime matrix
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}\osdk-ci-home
          USERPROFILE: ${{ runner.temp }}\osdk-ci-home
          OSDK_DATA_DIR: ${{ runner.temp }}\osdk-ci-data
          OSDK_CACHE_DIR: ${{ runner.temp }}\osdk-ci-cache
          OSDK_CONFIG_DIR: ${{ runner.temp }}\osdk-ci-config
          OSDK_STORE_DIR: ${{ runner.temp }}\osdk-ci-store
          OSDK_INSTALL_DIR: ${{ runner.temp }}\osdk-ci-installs
          CARGO_HOME: ${{ runner.temp }}\osdk-ci-cargo
          RUSTUP_HOME: ${{ runner.temp }}\osdk-ci-rustup
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: ./scripts/windows-runtime-smoke.ps1 -BinDir "$env:CARGO_TARGET_DIR\debug"

  # Explicit Windows cross-checks from Linux. Clippy guards every cfg path,
  # while Wine executes the Windows GNU test binaries against Win32 APIs even
  # before the native Windows/MSVC runner finishes.
  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cross clippy (windows-gnu)
        run: >-
          cargo clippy --locked --workspace --all-targets
          --target x86_64-pc-windows-gnu -- -D warnings
      - name: run windows tests under Wine
        env:
          OSDK_WINE_CACHE_DIR: ${{ runner.temp }}/one-sdk-wine-cache
        run: ./scripts/windows-wine-tests.sh

  # The unit tests prove the detection branching with a scripted runner, but only
  # a real distribution can confirm that the query interfaces osdk calls exist
  # and print what it expects. A dpkg-query flag that changed, or an apk output
  # shape that differs from the documented one, would leave every test green and
  # every report wrong.
  linux-distro-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Records the runtime and image digests. When a base image changes what it
      # ships -- which is how `jq` quietly became preinstalled on archlinux and
      # turned the pacman case into a no-op -- this is what makes the change
      # visible instead of leaving a green-looking skip.
      - name: Container preflight
        run: |
          set +e
          docker version --format 'server {{.Server.Version}}' 2>&1 | head -2
          for image in debian:stable-slim alpine:latest archlinux:latest fedora:latest; do
            echo "--- $image ---"
            docker pull -q "$image" 2>&1 | tail -1
            docker image inspect "$image" --format '{{index .RepoDigests 0}}' 2>&1 | tail -1
          done
          exit 0
      - name: detect apt/apk/pacman/dnf inside their own distributions
        run: ./scripts/linux-distro-detection.sh
