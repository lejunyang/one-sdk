name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so clippy/rustc lints stay clean.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is OS-independent; run it once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: check minimum supported Rust version
        run: cargo check --locked --workspace

  # Keep the interactive terminal contract visible on both macOS architectures.
  # This uses native GitHub-hosted macOS machines rather than emulation.
  macos-terminal:
    name: macOS terminal (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: interactive prompt through native PTY
        run: >-
          cargo test --locked -p osdk-cli --test isolated_cli
          terminal_prompt_accepts_interactive_confirmation -- --exact

  # Lint + unit tests across the three supported platforms.
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
        env:
          # Only the generic github: backend needs this. Current tests use local
          # fixture servers and do not require network access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build windows runtime binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: cargo build --locked --workspace --bins
      - name: windows runtime matrix
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}\osdk-ci-home
          USERPROFILE: ${{ runner.temp }}\osdk-ci-home
          OSDK_DATA_DIR: ${{ runner.temp }}\osdk-ci-data
          OSDK_CACHE_DIR: ${{ runner.temp }}\osdk-ci-cache
          OSDK_CONFIG_DIR: ${{ runner.temp }}\osdk-ci-config
          OSDK_STORE_DIR: ${{ runner.temp }}\osdk-ci-store
          OSDK_INSTALL_DIR: ${{ runner.temp }}\osdk-ci-installs
          CARGO_HOME: ${{ runner.temp }}\osdk-ci-cargo
          RUSTUP_HOME: ${{ runner.temp }}\osdk-ci-rustup
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: ./scripts/windows-runtime-smoke.ps1 -BinDir "$env:CARGO_TARGET_DIR\debug"

  # Explicit Windows cross-checks from Linux. Clippy guards every cfg path,
  # while Wine executes the Windows GNU test binaries against Win32 APIs even
  # before the native Windows/MSVC runner finishes.
  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cross clippy (windows-gnu)
        run: >-
          cargo clippy --locked --workspace --all-targets
          --target x86_64-pc-windows-gnu -- -D warnings
      - name: run windows tests under Wine
        env:
          OSDK_WINE_CACHE_DIR: ${{ runner.temp }}/one-sdk-wine-cache
        run: ./scripts/windows-wine-tests.sh
