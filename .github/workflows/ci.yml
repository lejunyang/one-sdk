name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so clippy/rustc lints stay clean.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting is OS-independent; run it once.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: check minimum supported Rust version
        run: cargo check --locked --workspace

  # Lint + unit tests across the three supported platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
        env:
          # Only the generic github: backend needs this. Current tests use local
          # fixture servers and do not require network access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build windows runtime binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: cargo build --locked --workspace --bins
      - name: windows runtime matrix
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}\osdk-ci-home
          USERPROFILE: ${{ runner.temp }}\osdk-ci-home
          OSDK_DATA_DIR: ${{ runner.temp }}\osdk-ci-data
          OSDK_CACHE_DIR: ${{ runner.temp }}\osdk-ci-cache
          OSDK_CONFIG_DIR: ${{ runner.temp }}\osdk-ci-config
          OSDK_STORE_DIR: ${{ runner.temp }}\osdk-ci-store
          OSDK_INSTALL_DIR: ${{ runner.temp }}\osdk-ci-installs
          CARGO_HOME: ${{ runner.temp }}\osdk-ci-cargo
          RUSTUP_HOME: ${{ runner.temp }}\osdk-ci-rustup
          CARGO_TARGET_DIR: ${{ runner.temp }}\osdk-ci-target
        run: ./scripts/windows-runtime-smoke.ps1 -BinDir "$env:CARGO_TARGET_DIR\debug"

  # Explicit Windows cross-compile check from Linux. This guards the
  # #[cfg(windows)] code paths (shim .cmd/bash generation, junctions, volume
  # detection) even if the Windows runner is unavailable.
  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cross clippy (windows-gnu)
        run: >-
          cargo clippy --locked --workspace --all-targets
          --target x86_64-pc-windows-gnu -- -D warnings
