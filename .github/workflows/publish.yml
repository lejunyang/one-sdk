name: Publish Binaries

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare release
    if: ${{ contains(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate workspace version
        id: version
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\]$/ { workspace_package = 1; next }
            /^\[/ { workspace_package = 0 }
            workspace_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$version"; then
            echo "Tag v$version already exists; bump the workspace version before publishing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}
      - name: Build release binaries
        run: >-
          cargo build --locked --release
          --package osdk-cli
          --package osdk-shim
          --target ${{ matrix.target }}
      - name: Package Unix binaries
        if: ${{ matrix.archive == 'tar' }}
        shell: bash
        run: |
          stage="$RUNNER_TEMP/osdk-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp \
            "target/${{ matrix.target }}/release/osdk" \
            "target/${{ matrix.target }}/release/osdk-shim" \
            "$stage/"
          tar -C "$stage" -czf \
            "dist/osdk-${{ matrix.target }}.tar.gz" \
            osdk osdk-shim
      - name: Package Windows binaries
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "osdk-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/osdk.exe", `
            "target/${{ matrix.target }}/release/osdk-shim.exe" `
            -Destination $stage
          Compress-Archive `
            -Path "$stage/osdk.exe", "$stage/osdk-shim.exe" `
            -DestinationPath "dist/osdk-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: osdk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish v${{ needs.prepare.outputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: osdk-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum osdk-* > SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/osdk-*
            dist/SHA256SUMS
