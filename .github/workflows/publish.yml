name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare release
    if: ${{ contains(github.event.head_commit.message, '[publish]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate workspace version
        id: version
        shell: bash
        run: |
          version=$(awk '
            /^\[workspace\.package\]$/ { workspace_package = 1; next }
            /^\[/ { workspace_package = 0 }
            workspace_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi
          core_dependency=$(sed -n \
            '/^\[workspace.dependencies\]/,/^\[/s/^osdk-core = { version = "\(=[^"]*\)".*/\1/p' \
            Cargo.toml)
          if [[ "$core_dependency" != "=$version" ]]; then
            echo "workspace osdk-core dependency must be pinned to =$version" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$version"; then
            echo "Tag v$version already exists; bump the workspace version before publishing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux-gnu:
    name: build (${{ matrix.target }}, glibc 2.31 baseline)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Ubuntu 20.04 is a fixed maintained LTS and supplies glibc 2.31. The
    # symbol-version gate below is the binding contract: changing the
    # image or toolchain cannot silently raise the published ABI floor.
    container: ubuntu:20.04
    env:
      OSDK_RELEASE_BIN_DIR: target/${{ matrix.target }}/release
    steps:
      - name: Install build prerequisites
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          binutils build-essential ca-certificates curl git
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add "${{ matrix.target }}" \
            --toolchain 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}-glibc-2.31
      # Built in two invocations on purpose. The shim depends on osdk-core with
      # `default-features = false` so the download pipeline and sigstore
      # verification stay out of it (7.4 MB -> 3.2 MB), but Cargo unifies
      # features across a single `--workspace` build and would put them back.
      # A compile-time assertion in the shim fails the release build if these
      # are ever merged back into one command.
      - name: Build release CLI
        run: >-
          cargo build --locked --release
          -p osdk-cli
          --target ${{ matrix.target }}
      - name: Build release shim
        run: >-
          cargo build --locked --release
          -p osdk-shim
          --target ${{ matrix.target }}
      - name: Verify the glibc compatibility contract
        shell: bash
        run: |
          # The one point that proves the freshly linked binaries actually
          # start on this target before they are packaged and published.
          "$OSDK_RELEASE_BIN_DIR/osdk" --version
          "$OSDK_RELEASE_BIN_DIR/osdk-shim" --version
          failure_log="$RUNNER_TEMP/glibc-baseline-negative-control.log"
          # The checker scripts are invoked directly on purpose. Going through
          # `osdk run` would build the full managed environment and require
          # every tool the project declares (including ones this job did not
          # install); this contract only needs the script and readelf.
          if OSDK_GLIBC_BASELINE=0.0 \
            bash ./scripts/check-glibc-baseline.sh \
              >"$failure_log" 2>&1; then
            echo "The glibc checker accepted an intentionally impossible baseline." >&2
            exit 1
          fi
          grep -F 'exceeding the supported GLIBC_0.0 baseline' "$failure_log"
          bash ./scripts/check-glibc-baseline.sh
      - name: Package Unix binaries
        shell: bash
        run: |
          stage="$RUNNER_TEMP/osdk-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp \
            "target/${{ matrix.target }}/release/osdk" \
            "target/${{ matrix.target }}/release/osdk-shim" \
            "$stage/"
          tar -C "$stage" -czf \
            "dist/osdk-${{ matrix.target }}.tar.gz" \
            osdk osdk-shim
      - uses: actions/upload-artifact@v4
        with:
          name: osdk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-native:
    name: build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure native musl compiler
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          target_env=${target//-/_}
          cargo_target_env=$(printf '%s' "$target_env" | tr '[:lower:]' '[:upper:]')
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
          # C build scripts need musl headers, while rustc's bundled linker and
          # CRT produce the portable static PIE. Using musl-gcc as rustc's final
          # linker instead emits an interpreter on Debian/Ubuntu.
          echo "CARGO_TARGET_${cargo_target_env}_RUSTFLAGS=-C link-self-contained=yes" \
            >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}
      # Built in two invocations on purpose. The shim depends on osdk-core with
      # `default-features = false` so the download pipeline and sigstore
      # verification stay out of it (7.4 MB -> 3.2 MB), but Cargo unifies
      # features across a single `--workspace` build and would put them back.
      # A compile-time assertion in the shim fails the release build if these
      # are ever merged back into one command.
      - name: Build release CLI
        run: >-
          cargo build --locked --release
          -p osdk-cli
          --target ${{ matrix.target }}
      - name: Build release shim
        run: >-
          cargo build --locked --release
          -p osdk-shim
          --target ${{ matrix.target }}
      - name: Verify static musl binaries
        if: ${{ endsWith(matrix.target, '-linux-musl') }}
        shell: bash
        env:
          OSDK_RELEASE_BIN_DIR: target/${{ matrix.target }}/release
        run: |
          "$OSDK_RELEASE_BIN_DIR/osdk" --version
          "$OSDK_RELEASE_BIN_DIR/osdk-shim" --version
          failure_dir="$RUNNER_TEMP/dynamic-negative-control"
          failure_log="$RUNNER_TEMP/musl-static-negative-control.log"
          mkdir -p "$failure_dir"
          cp /bin/sh "$failure_dir/osdk"
          cp /bin/sh "$failure_dir/osdk-shim"
          if OSDK_RELEASE_BIN_DIR="$failure_dir" \
            bash ./scripts/check-musl-static.sh \
              >"$failure_log" 2>&1; then
            echo "The musl checker accepted intentionally dynamic binaries." >&2
            exit 1
          fi
          grep -F 'is not a static musl binary' "$failure_log"
          bash ./scripts/check-musl-static.sh
      - name: Package Unix binaries
        if: ${{ matrix.archive == 'tar' }}
        shell: bash
        run: |
          stage="$RUNNER_TEMP/osdk-${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp \
            "target/${{ matrix.target }}/release/osdk" \
            "target/${{ matrix.target }}/release/osdk-shim" \
            "$stage/"
          tar -C "$stage" -czf \
            "dist/osdk-${{ matrix.target }}.tar.gz" \
            osdk osdk-shim
      - name: Package Windows binaries
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "osdk-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/osdk.exe", `
            "target/${{ matrix.target }}/release/osdk-shim.exe" `
            -Destination $stage
          Compress-Archive `
            -Path "$stage/osdk.exe", "$stage/osdk-shim.exe" `
            -DestinationPath "dist/osdk-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: osdk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: publish crates.io
    needs: [prepare, build-linux-gnu, build-native]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      - name: Use the official crates.io index for publishing
        shell: bash
        run: |
          if [[ -f .cargo/config.toml ]]; then
            mv .cargo/config.toml .cargo/config.toml.build-mirror
          fi
      - name: Select crates.io credential
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          token="$OIDC_TOKEN"
          if [[ -z "$token" ]]; then
            token="$BOOTSTRAP_TOKEN"
          fi
          if [[ -z "$token" ]]; then
            echo "crates.io authentication failed. For the first release, add CARGO_REGISTRY_TOKEN to the crates-io environment; for later releases, configure trusted publishers for publish.yml." >&2
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify and publish osdk-core
        run: |
          cargo publish --locked --registry crates-io --dry-run -p osdk-core
          cargo publish --locked --registry crates-io -p osdk-core
      - name: Wait for osdk-core ${{ needs.prepare.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              -H "User-Agent: one-sdk-publish/${GITHUB_RUN_ID}" \
              "https://crates.io/api/v1/crates/osdk-core/$VERSION" >/dev/null; then
              exit 0
            fi
            echo "Waiting for osdk-core $VERSION to become visible ($attempt/30)"
            sleep 10
          done
          echo "osdk-core $VERSION did not become visible on crates.io in time" >&2
          exit 1
      - name: Verify and publish binary crates
        run: |
          cargo publish --locked --registry crates-io --dry-run -p osdk-cli
          cargo publish --locked --registry crates-io --dry-run -p osdk-shim
          cargo publish --locked --registry crates-io -p osdk-cli
          cargo publish --locked --registry crates-io -p osdk-shim

  release:
    name: publish v${{ needs.prepare.outputs.version }}
    needs: [prepare, build-linux-gnu, build-native, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: osdk-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum osdk-* > SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/osdk-*
            dist/SHA256SUMS
