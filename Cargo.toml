[workspace]
resolver = "2"
members = [
    "crates/osdk-cli",
    "crates/osdk-core",
    "crates/osdk-shim",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/lejunyang/one-sdk"
homepage = "https://lejunyang.github.io/one-sdk/"
rust-version = "1.91.1"

[workspace.dependencies]
osdk-core = { version = "=0.0.1", path = "crates/osdk-core" }
# CLI
clap = { version = "4", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4"
# async runtime + http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }
async-trait = "0.1"
# `rustls` replaces 0.12's `rustls-tls`. It verifies against the platform trust
# store rather than a bundled copy of the webpki roots, which 0.13 removed: an
# OS-managed store picks up enterprise CAs and revocations without a release of
# ours, at the cost of depending on the host being correctly provisioned.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "json", "http2"] }
futures-util = "0.3"
# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
# archives
flate2 = "1"
tar = "0.4"
# Statically bundle liblzma: lzma-sys otherwise prefers a pkg-config-discovered
# shared library (e.g. Homebrew's /opt/homebrew/opt/xz), whose absolute load
# path is missing on machines without xz installed.
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
# hashing
sha2 = "0.10"
sha1 = "0.10"
blake3 = "1"
hex = "0.4"
# signatures
minisign-verify = "0.2"
sigstore = { version = "0.14", default-features = false, features = ["verify", "sigstore-trust-root"] }
sigstore-verify = { version = "0.11", default-features = false }
x509-cert = "0.2"
snap = "1"
# base64 (npm SRI integrity decoding)
base64 = "0.22"
# fs / dirs
directories = "5"
dunce = "1"
reflink-copy = "0.1"
fslock = "0.2"
same-file = "1"
which = "8"
tempfile = "3"
walkdir = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # CreateFileW and the other reparse-point entry points take a
    # SECURITY_ATTRIBUTES pointer, so they are gated behind Win32_Security.
    "Win32_Security",
    # DeviceIoControl + FSCTL_SET_REPARSE_POINT, used to create the
    # directory junctions that expose Android packages in one SDK root.
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
libc = "0.2"
# versions
semver = "1"
regex = "1"
globset = "0.4"
# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ui
indicatif = "0.17"
once_cell = "1"

# Release builds are what users download, so this profile is tuned for size.
# The numbers below were measured on this workspace; see
# site/en/guide/implementation/releasing.md for the method.
#
#   opt-level = 3, lto = "thin"   44.6 MB total   (the previous setting)
#   opt-level = 3, lto = "fat"    37.0 MB total
#   opt-level = "z", lto = "fat"  16.7 MB total   (this setting)
#
# `opt-level = "z"` does not slow the shim down: shim startup measured
# 48.3 ms median versus 50.5 ms at opt-level 3, because process creation
# dominates. It does, however, cost dearly in one place -- see the per-package
# overrides below, which are load-bearing rather than decorative.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# `opt-level = "z"` costs SHA-256 roughly 65% of its throughput (2300 MiB/s ->
# 800 MiB/s measured over 256 MiB), because sha2's portable backend relies on
# optimizations that "z" disables. Every downloaded archive is checksummed, so
# that would slow down every install. Compiling just these crates at opt-level 3
# restores full speed (2325 MiB/s) and costs about 0.02 MB of binary size.
#
# blake3 is listed for the same reason even though it measured unaffected (it
# ships hand-written SIMD): it hashes every file entering the CAS, so it should
# not silently regress if that implementation detail changes.
#
# Cargo only *warns* when one of these names matches no package, so a rename or
# typo would silently give back the slowdown. The test
# `hashing_crates_are_pinned_to_a_fast_opt_level` in
# crates/osdk-core/src/pipeline/verify.rs guards this list.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.digest]
opt-level = 3

[profile.release.package.block-buffer]
opt-level = 3

[profile.release.package.cpufeatures]
opt-level = 3
