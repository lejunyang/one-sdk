[workspace]
resolver = "2"
members = [
    "crates/osdk-cli",
    "crates/osdk-core",
    "crates/osdk-shim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lejunyang/one-sdk"
rust-version = "1.88"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4"
# async runtime + http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json", "http2"] }
futures-util = "0.3"
# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
toml = "0.8"
toml_edit = "0.22"
# archives
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
# hashing
sha2 = "0.10"
blake3 = "1"
hex = "0.4"
# signatures
minisign-verify = "0.2"
sigstore = { version = "0.14", default-features = false, features = ["verify", "sigstore-trust-root"] }
sigstore-verify = { version = "0.11", default-features = false }
x509-cert = "0.2"
snap = "1"
# base64 (npm SRI integrity decoding)
base64 = "0.22"
# fs / dirs
directories = "5"
dunce = "1"
reflink-copy = "0.1"
fslock = "0.2"
same-file = "1"
which = "6"
tempfile = "3"
walkdir = "2"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
libc = "0.2"
# versions
semver = "1"
regex = "1"
globset = "0.4"
# errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ui
indicatif = "0.17"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
