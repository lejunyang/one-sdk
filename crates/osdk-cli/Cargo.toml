[package]
name = "osdk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Cross-platform manager for language runtimes, developer tools, and model snapshots"
readme = "../../README.md"
keywords = ["sdk", "toolchain", "version-manager", "runtime"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "osdk"
path = "src/main.rs"

[features]
# Mirrors osdk-core's feature of the same name. A `cfg(feature = "scripts")`
# inside this crate tests *this* crate's feature list, not the dependency's, so
# the flag has to exist on both sides or the Lua branches silently vanish and
# the match stops being exhaustive.
default = ["scripts"]
scripts = ["osdk-core/scripts"]

[dependencies]
osdk-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
futures-util.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
indicatif.workspace = true
dunce.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
# Read-only WinINET registry access for `osdk doctor`'s system-proxy
# diagnostic. CLI-only: the shim never shows diagnostics and must not pay for it.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
libc.workspace = true
