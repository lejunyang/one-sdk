[package]
name = "osdk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Core library for the cross-platform osdk toolchain manager"
readme = "../../README.md"
keywords = ["sdk", "toolchain", "version-manager", "runtime"]
categories = ["development-tools", "development-tools::build-utils"]

[features]
# The install path (remote version listing, the download pipeline, sigstore
# verification) is only reachable from the CLI. The shim resolves and execs
# already-installed tools, so it builds without this feature and drops that
# whole subtree: thirteen backends cost 7.02 MB behind `dyn Backend` vtables
# versus 1.87 MB when the install methods are gone.
#
# Cargo unifies features across a single `--workspace` build, which silently
# re-enables this for the shim and undoes the saving. The two binaries must be
# built in separate cargo invocations; see .github/workflows/publish.yml.
default = ["install"]
install = ["dep:sigstore", "dep:sigstore-verify", "dep:x509-cert", "dep:sevenz-rust2"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_yaml.workspace = true
toml.workspace = true
toml_edit.workspace = true
flate2.workspace = true
tar.workspace = true
xz2.workspace = true
zstd.workspace = true
zip.workspace = true
# Only the install path unpacks a .7z. Optional so the shim never links a second
# LZMA implementation; see the workspace manifest for why 0.19 is pinned.
sevenz-rust2 = { workspace = true, optional = true }
sha2.workspace = true
sha1.workspace = true
blake3.workspace = true
hex.workspace = true
minisign-verify.workspace = true
# Only the install path verifies attestations. Optional so the shim's build
# graph drops them entirely (982 crates -> fewer, and no duplicate reqwest).
sigstore = { workspace = true, optional = true }
sigstore-verify = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
snap.workspace = true
base64.workspace = true
directories.workspace = true
dunce.workspace = true
reflink-copy.workspace = true
fslock.workspace = true
same-file.workspace = true
which.workspace = true
tempfile.workspace = true
walkdir.workspace = true
windows-sys.workspace = true
libc.workspace = true
semver.workspace = true
regex.workspace = true
globset.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
indicatif.workspace = true
once_cell.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The shipped dependency is decode-only. Tests need to *build* a .7z fixture, so
# the encoder is a dev-dependency and never reaches either binary.
sevenz-rust2 = { workspace = true, features = ["compress"] }
