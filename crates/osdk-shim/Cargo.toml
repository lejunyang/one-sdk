[package]
name = "osdk-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Execution shim for tools activated by the osdk toolchain manager"
readme = "../../README.md"
keywords = ["sdk", "toolchain", "version-manager", "shim"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "osdk-shim"
path = "src/main.rs"

# The shim stays synchronous for ordinary tools. Dependency-fetching package
# manager commands create a current-thread runtime for their fresh registry
# preflight only.
[dependencies]
# Deliberately not `osdk-core.workspace = true`: the shim never installs
# anything, so it opts out of the `install` feature and the download pipeline
# plus sigstore verification leave its binary entirely.
#
# This only holds when the shim is built in its own cargo invocation. Cargo
# unifies features across one `--workspace` build, which would put the install
# path back. See .github/workflows/publish.yml.
osdk-core = { path = "../osdk-core", version = "0.0.1", default-features = false }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
