[package]
name = "osdk-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "osdk-shim"
path = "src/main.rs"

# The shim stays synchronous for ordinary tools. Dependency-fetching package
# manager commands create a current-thread runtime for their fresh registry
# preflight only.
[dependencies]
osdk-core = { path = "../osdk-core" }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
