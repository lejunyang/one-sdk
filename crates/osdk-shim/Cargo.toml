[package]
name = "osdk-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Execution shim for tools activated by the osdk toolchain manager"
readme = "../../README.md"
keywords = ["sdk", "toolchain", "version-manager", "shim"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "osdk-shim"
path = "src/main.rs"

# The shim stays synchronous for ordinary tools. Dependency-fetching package
# manager commands create a current-thread runtime for their fresh registry
# preflight only.
[dependencies]
osdk-core.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
