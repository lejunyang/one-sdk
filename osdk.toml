# osdk project configuration for one-sdk itself.
#
# Two jobs: pin the toolchain this repo is built with, and make every check CI
# runs available as one named task, so "what does CI do" has a single answer
# that can also be run locally.

[tools]
# Matches rust-toolchain.toml. Both exist on purpose: rust-toolchain.toml is what
# cargo and rust-analyzer read without osdk, this is what osdk installs.
#
# `targets` carries the Windows GNU triple because that is what
# scripts/windows-wine-tests.sh cross-compiles for -- CI installs it as a
# separate step, and a contributor who does not have it gets a link error rather
# than an explanation.
rust = { version = "1.98.0", components = "rustfmt,clippy", targets = "x86_64-pc-windows-gnu,x86_64-unknown-linux-musl" }

# scripts/test-installers.sh serves the fixture archives over `python3 -m
# http.server`. Without it the installer smoke exits before printing anything.
python = "3.12"

# System packages the Wine cross-test needs. Declaring them here does not install
# anything: `[syspkg]` is a declaration, `osdk pkg status` is read-only, and only
# an explicit `osdk pkg apply --yes` installs. So a contributor gets
#
#   osdk pkg status     # is mingw missing?
#   osdk pkg apply --yes
#
# instead of reading a link error and guessing the package name for their distro.
#
# Why mingw and not zig: rustc's `x86_64-pc-windows-gnu` target links through
# `x86_64-w64-mingw32-gcc`, and it passes GNU-ABI import libraries
# (`-lmsvcrt -lmingwex -lmingw32 -lgcc_eh -l:libpthread.a`). Measured: `zig cc`
# builds the wine-ready.c probe into a real PE32+ fine, but as rustc's linker it
# fails with `unable to find dynamic system library 'msvcrt'` -- zig resolves libc
# its own way and does not ship those `.a` files, while mingw has libmsvcrt.a.
# Same crate and toolchain with mingw as the linker succeeds, so the difference is
# the linker, not the setup. zig stays what the README already recommends it for:
# users cross-compiling C, which does not go through rustc's linker protocol.
[syspkg]
# Left unrestricted on purpose: one entry per package manager below, filtered by
# `os`, so whichever manager the host actually has is the one that applies.

[syspkg.packages]
# Package names verified against each distro's own index; osdk deliberately does
# no cross-manager name mapping, so each has to be spelled its own way.

# A C compiler, for every Linux contributor -- not just the ones cross-compiling.
# rustc drives linking through `cc`, so without it the build dies on `proc-macro2`
# and `quote`, crates with no C in them at all, behind a screen of linker
# arguments whose actual cause ("cc: command not found") is one note among many.
# Measured on a clean graph: `cc` is the only host compiler the build invokes;
# cmake, make, perl and nasm are never called, and pkg-config is optional.
#
# macOS is deliberately absent: `cc` comes from the Xcode Command Line Tools
# (`xcode-select --install`), not from any package manager osdk drives, so an
# entry here could only ever be wrong. See the note below.
"apt:build-essential" = { version = "latest", os = "linux" }
"apt:musl-tools" = { version = "latest", os = "linux" }
"dnf:gcc" = { version = "latest", os = "linux" }
"pacman:gcc" = { version = "latest", os = "linux" }
"apk:build-base" = { version = "latest", os = "linux" }

# The Windows cross-compilation linker, needed only by `wine-tests`.
"apt:mingw-w64" = { version = "latest", os = "linux" }
"dnf:mingw64-gcc" = { version = "latest", os = "linux" }
"pacman:mingw-w64-gcc" = { version = "latest", os = "linux" }
"apk:mingw-w64-gcc" = { version = "latest", os = "linux" }

# Not declared here: a C compiler for macOS. `cc` is just as required there, but
# it ships with the Xcode Command Line Tools and is installed by
# `xcode-select --install` -- there is no Homebrew (or other) package that
# provides it, so any entry would report a state that does not correspond to
# whether the compiler exists. A fresh mac needs that one command before the
# first build; everything else in this file applies unchanged.
#
# Not declared here: docker/podman for `distro-detection`. A container runtime is
# a daemon, a user group and a storage driver, not just a package -- installing it
# through a package manager leaves it unconfigured and not running, so the entry
# would report "installed" while the task still skips. That script already skips
# cleanly with a message when neither runtime is present.

[tasks]
# --- the everyday loop -------------------------------------------------------
fmt = "cargo fmt --all"
build = "cargo build --workspace"

[tasks.fmt-check]
description = "Formatting, as CI checks it"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lints at the CI gate's own setting"
# `-- -D warnings` rather than parsing output: the gate is the exit code, and a
# checker that greps for `^error` misses `warning:` and reports clean while CI
# fails (AGENTS.md, 验证失效模式).
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Workspace test suite"
run = "cargo test --workspace"

[tasks.msrv]
description = "Minimum supported Rust version still compiles"
# Pinned separately from [tools]: this must use the OLD compiler, so it asks
# rustup for it explicitly instead of the project toolchain.
run = "rustup run 1.91.1 cargo check --locked --workspace"

# --- what CI runs, grouped so the name says which platform it covers ---------
[tasks.ci]
description = "Everything CI runs on this platform"
run = [{ tasks = ["fmt-check", "clippy", "test"] }]

[tasks.windows-smoke]
description = "Windows runtime contract: shims, long paths, StrictMode activation"
# Not covered by cargo test at all -- it drives the real cmd/PowerShell/Git Bash
# shim chains, a >260 character state root, and renders activate/deactivate under
# `Set-StrictMode -Version Latest`. A StrictMode defect reached CI green through
# `cargo test --workspace` precisely because nothing here is a unit test.
#
# Depends on `build` so -BinDir points at binaries built from the current source
# rather than whatever was left in target/ (a stale binary makes this pass while
# testing the previous build).
depends = ["build"]
run = "pwsh -NoProfile -File scripts/windows-runtime-smoke.ps1 -BinDir target/debug"
when = { os = "windows" }

[tasks.wine-tests]
description = "Windows GNU test suite under Wine, from Linux"
# Requires mingw-w64 and the x86_64-pc-windows-gnu target; the script downloads
# and checksums its own pinned Wine build.
run = "./scripts/windows-wine-tests.sh"
when = { os = "linux" }

[tasks.installers]
description = "Installer smoke test"
run = "./scripts/test-installers.sh"
when = { os = ["linux", "macos"] }

[tasks.installers-windows]
description = "Installer smoke test (PowerShell installer)"
run = "pwsh -NoProfile -File scripts/test-installers.ps1"
when = { os = "windows" }
[tasks.comfyui-view-e2e]
description = "ComfyUI model-view end-to-end (real CLI + headless source-tree ComfyUI)"
# Drives pull -> declarative [models] render -> extra_model_paths.yaml export ->
# real folder_paths discovery, plus the two-model same-root collision contract.
# Needs a ComfyUI checkout and a Python with PyYAML; pass them explicitly. Not
# part of `ci`/`test`: an environment-heavy integration guard run on demand.
# All OSDK_* state is temp-isolated and the Desktop install is untouched.
run = "pwsh -NoProfile -File scripts/test-comfyui-model-view.ps1 -BinDir target/debug -ComfyDir $OSDK_COMFYUI_DIR"
when = { os = "windows" }

[tasks.live-smoke]
description = "Live smoke harness used by the fmt job"
run = "./scripts/test-live-smoke.sh"
when = { os = ["linux", "macos"] }

[tasks.distro-detection]
description = "Package-manager detection inside real distro containers"
# Skips cleanly when neither docker nor podman is present.
run = "./scripts/linux-distro-detection.sh"
when = { os = "linux" }

[tasks.bench]
description = "Interaction-latency benchmarks (hook-env, shim, inventory scan)"
# Required after touching hook-env, activation, shim startup or the inventory
# scan: these measure traversal counts, which stay deterministic under noise.
run = "cargo bench -p osdk-core"

[tasks.size]
description = "Release binary sizes, measured the way that gives the real number"
# Two separate invocations on purpose. A single `--workspace` release build makes
# Cargo unify features, re-enabling `install` for the shim: the binary still
# works, nothing warns, and the size silently doubles. osdk-shim has a
# compile-time assertion against exactly this -- if it fires, fix the command,
# not the assertion.
run = [
  "cargo build --release -p osdk-cli",
  "cargo build --release -p osdk-shim",
]
env = { CARGO_TARGET_DIR = "target/size-check" }

[tasks.site]
description = "Build the documentation site (dead links fail the build)"
dir = "site"
run = "bun run build"
