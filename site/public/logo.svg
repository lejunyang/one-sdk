<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="osdk">
  <title>osdk</title>
  <defs>
    <linearGradient id="osdk-bg" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f8f74"/>
      <stop offset="1" stop-color="#173f35"/>
    </linearGradient>
    <linearGradient id="osdk-front" x1="40" y1="100" x2="168" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f6e2bb"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="256" height="256" rx="60" fill="url(#osdk-bg)"/>
  <!-- Stacked SDK layers: one manager over many toolchains -->
  <rect x="100" y="40" width="116" height="88" rx="18" fill="#f2bd73" opacity="0.5"/>
  <rect x="72" y="70" width="120" height="96" rx="19" fill="#f2bd73" opacity="0.82"/>
  <rect x="40" y="100" width="128" height="112" rx="20" fill="url(#osdk-front)"/>
  <!-- Prompt on the front layer -->
  <path d="M68 136 L94 156 L68 176" fill="none" stroke="#1f6f5c" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="106" y="169" width="40" height="14" rx="7" fill="#1f6f5c"/>
</svg>
